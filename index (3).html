<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTS Flight Study Hub</title><style>:root{font-family:system-ui,Arial;background:#eef2f7;color:#17243b}*{box-sizing:border-box}body{margin:0}header{background:#102747;color:white;padding:22px max(20px,calc((100vw - 900px)/2))}h1{margin:0;font-size:1.6rem}header p{margin:5px 0;color:#c9d9eb}main{max-width:900px;margin:auto;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#173d69;color:white;font-weight:650}button.secondary{background:#dce5ef;color:#18314c}button:disabled{opacity:.5;cursor:default}.tabs button.active{background:#087d89}.panel{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #132b4414;margin-bottom:18px}.muted{color:#52647b}.flex{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.card{min-height:230px;border:2px solid #bed2e5;border-radius:15px;display:grid;place-items:center;text-align:center;padding:25px;margin:20px 0;background:#f5f9fd;cursor:pointer;font-size:1.35rem;font-weight:650;white-space:pre-wrap}.answer{background:#eaf8f1;border-color:#7ac6a4}input,textarea,select{width:100%;padding:11px;border:1px solid #b8c7d5;border-radius:8px;font:inherit;margin:5px 0 13px}textarea{min-height:95px}label{font-weight:650} .option{display:block;width:100%;margin:7px 0;text-align:left;background:#e7edf4;color:#17243b}.correct{background:#b5e7c8!important}.wrong{background:#ffd2d2!important}.pill{display:inline-block;background:#dceaf8;border-radius:50px;padding:5px 10px;margin:4px;font-size:.85rem} .hide{display:none} .notice{padding:10px;border-radius:8px;background:#edf7f7;margin:10px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}small{color:#586d82} .danger{background:#9b3030} @media(max-width:600px){main{padding:12px}.panel{padding:15px}.card{font-size:1.1rem}}</style></head><body><header><h1>✦ OTS Flight Study Hub</h1><p>Study smarter. Build confidence. Learn together.</p></header><main><div class="tabs" id="tabs"></div><section id="home" class="panel"></section><section id="study" class="panel hide"></section><section id="quiz" class="panel hide"></section><section id="manage" class="panel hide"></section><section id="leaderboard" class="panel hide"></section></main><script>
const starter=[{"q":"What is transactional leadership?","a":"A leadership approach emphasizing clear expectations, performance, rewards, and corrective action.","choices":["Leadership based on exchanges, expectations, and rewards","Leadership with no performance standards","Leadership that avoids corrective action","Leadership based only on personal charisma"],"correct":0,"topic":"Leadership"},{"q":"What is active management by exception (MBE-A)?","a":"A leader actively monitors performance for deviations and takes corrective action when needed.","choices":["Ignoring deviations","Actively monitoring for deviations and correcting them","Only rewarding exceptional work","Delegating all oversight"],"correct":1,"topic":"Leadership"},{"q":"Why is audience awareness important in an intelligence briefing?","a":"It helps tailor the level of detail, terminology, and key judgments to decision-makers’ needs.","choices":["It eliminates the need for evidence","It ensures every briefing is identical","It helps tailor the message to decision-makers","It replaces critical thinking"],"correct":2,"topic":"Communication"},{"q":"What should an intelligence assessment clearly explain?","a":"Its key judgment, supporting evidence, reasoning, uncertainty, and why the assessment matters.","choices":["Only the analyst’s conclusion","Only background information","Only the most recent report","The judgment, evidence, reasoning, uncertainty, and significance"],"correct":3,"topic":"Critical Thinking"},{"q":"Describe a professional relationship.","a":"They are interpersonal relationships that reflect the standards of conduct expected of members in the military.","topic":"Professional and Unprofessional Relationships"},{"q":"Describe unprofessional relationships.","a":"Unprofessional relationships can exist between officers, between enlisted members, between officers and enlisted members, between military personnel and civilian employees, or between military members and contractor personnel.","topic":"Professional-Unprofessional Relationships"},{"q":"Summarize the policy on professional and unprofessional relationships.","a":"Airmen and Guardians are expected to avoid those relationships which negatively affect morale, good order and discipline, respect for authority, and unit cohesion.","topic":"Professional-Unprofessional Relationships"},{"q":"Summarize the general prohibitions relating to unprofessional relationships for officers.","a":"Officers must not engage in any activity with an enlisted member which reasonably may prejudice good order and discipline, discredit the armed forces or compromise the officer’s standing. It includes fraternization, failure to obey lawful orders, dereliction of duty, and conduct unbecoming an officer.","topic":"Professional-Unprofessional Relationships"},{"q":"What is fraternization (general prohibition)?","a":"Fraternization is a unique type of unprofessional relationship between an officer and enlisted member that is specifically criminalized in the Uniform Code of Military Justice under Article 134, Fraternization (Manual for Courts-Martial (2019), Part IV, Paragraph 83) (10 United States Code Section 934). Fraternization exists when a relationship between an officer and an enlisted member puts the enlisted member on terms of military equality with the officer in such a way that prejudices good order and discipline in the armed forces or is of a nature to bring discredit upon the armed forces. This custom of the service recognizes that officers will not form personal relationships with enlisted members on terms of military equality, whether on or off duty.","topic":"Professional-Unprofessional Relationships"},{"q":"Summarize specific prohibitions relating to unprofessional relationships for officers.","a":"Officers will not gamble with enlisted members, lend money to, borrow money from or otherwise become indebted to enlisted members, will not date or engage in sexual relations with enlisted members, will not engage, on a personal basis, in business enterprises with enlisted members, or solicit or make solicited sales to enlisted members.","topic":"Professional-Unprofessional Relationships"},{"q":"Summarize the effects of unprofessional relationships on unit cohesiveness.","a":"Erodes trust in command. Undermines obedience under stress. Weakens the authority of other leaders. Creates real or perceived favoritism, which damages morale even if no actual unfairness occurred. Confuses the chain of command's authority, since undue familiarity blurs the line between social equality and military rank/authority.","topic":"Professional-Unprofessional Relationships"},{"q":"Explain how the virtues relate to the USAF and USSF Core Values.","a":"Virtues are the desired behaviors and characteristics that we must practice and demonstrate. They are the behaviors that demonstrate that a person truly values the Core Values. Consistently practicing the virtues associated with the Core Values develops habits of honorable thought and action, which form the foundation of professionalism and character. Core Value = WHAT you value. Virtue/Commitment = HOW you demonstrate it.","topic":"USAF and USSF Core Values"},{"q":"Describe Integrity First and its related virtues.","a":"Single most important part of character\nDoing the right thing, all the time\nMoral compass that keeps us on the right path\nFoundation upon which trust is built\nThoughts and actions align with what is right.\nIts related virtues are honesty, courage, accountability, and humility.","topic":"USAF and USSF Core Values"},{"q":"Describe honesty.","a":"This is the only way to preserve the trust we hold so dear with each other and with the population we serve","topic":"USAF and USSF Core Values"},{"q":"Describe courage.","a":"Willingness to take personal and professional risks, make decisions that may be unpopular, and to admit to our mistakes.","topic":"USAF and USSF Core Values"},{"q":"Describe accountability.","a":"Maintain transparency, seek honest and constructive feedback, and take ownership of actions and decisions.","topic":"USAF and USSF Core Values"},{"q":"Describe humility.","a":"Service with gratitude and absent arrogance; putting others before ourselves as we seek to add value to our communities.","topic":"USAF and USSF Core Values"},{"q":"Describe Service Before Self and its related virtues.","a":"Professional duties take precedence over personal desires\nCall to live to a higher standard\nCommitment that takes energy, dedication, and sacrifice\nServant mindset\nEmbrace expectations and requirements of the profession of arms\nIts related virtues are duty, loyalty, and respect.","topic":"USAF and USSF Core Values"},{"q":"Describe duty.","a":"Consistently choosing to make necessary sacrifices to accomplish the mission and, in doing so, honoring those who make the ultimate sacrifice.","topic":"USAF and USSF Core Values"},{"q":"Describe loyalty.","a":"Commitment to the success and preservation of something bigger than ourselves - demonstrated by helping each other act with honor.","topic":"USAF and USSF Core Values"},{"q":"Describe respect.","a":"Treating others with dignity and valuing them as individuals.","topic":"USAF and USSF Core Values"},{"q":"Describe Excellence in All We Do and its related virtues.","a":"Does not mean that we demand perfection. Directs us to continually advance our craft and increase our knowledge as Air Force professionals. Passion for continuous improvement and innovation to propel accomplishment and performance. On a personal level, Air Force professionals seek out and complete developmental education; work to stay in their best physical, mental, and moral shape. Its related virtues are mission, discipline, and teamwork.","topic":"USAF and USSF Core Values"},{"q":"Describe mission.","a":"A complex undertaking requiring a focus encompassed with operations, product, and resource excellence","topic":"USAF and USSF Core Values"},{"q":"Describe discipline.","a":"Commitment to uphold the highest of personal and professional standards.","topic":"USAF and USSF Core Values"},{"q":"Describe teamwork.","a":"Recognizing the interdependency of every member’s contributions towards the mission and strive for organizational excellence.","topic":"USAF and USSF Core Values"},{"q":"What are the USSF core values?","a":"Character, connection, commitments, and courage.","topic":"USAF and USSF Core Values"},{"q":"Describe Character.","a":"Defend the Constitution and serve the nation\nHigh moral character and ethical standards\nIntegrity, grit, honesty, authenticity, trustworthiness\nAccountable for decisions, actions, & inactions\nHonor obligation to mission, fellow Guardians, loved ones","topic":"USAF and USSF Core Values"},{"q":"Describe the commitments of character.","a":"Act with integrity, honesty, candor, transparency, and dedication to the team. Be accountable to the team for decisions and actions. Uphold the highest standards and live the USSF values.","topic":"USAF and USSF Core Values"},{"q":"Describe connection.","a":"Common purpose greater than ourselves. Stronger together than individually. Embrace a variety of perspectives. Treat everyone with dignity, empathy, respect. Leverage the best each has to offer","topic":"USAF and USSF Core Values"},{"q":"Describe the commitments of connection.","a":"Engage everyone with respect, honesty, and authenticity. Foster an environment that encourages expression and is free from fear. Encourage teammates to share thoughts and talents. Give help when asked and seek assistance when needed.","topic":"USAF and USSF Core Values"},{"q":"Describe commitment.","a":"Pursuit of mastery of self, profession, domain. See opportunities to learn and grow. Make best use of the unique strengths of teammates.","topic":"USAF and USSF Core Values"},{"q":"Describe the commitments of commitments.","a":"Work to achieve audacious goals. Learn from experience\nSeek and offer candid feedback. Facilitate growth and improvement\nEmbrace challenges. Work to be better tomorrow than today.","topic":"USAF and USSF Core Values"},{"q":"Describe courage.","a":"Do what needs to be done. Say what needs to be said\nHold to our convictions. Recognize power to choose, regardless of circumstance. Bias toward action. Accept necessary risk to secure & defend domain.","topic":"USAF and USSF Core Values"},{"q":"Describe the commitments of courage.","a":"Be steadfast and stand up for what is right. Seek opportunities to innovate. Share thoughts and ideas to help the team and mission\nTake smart risks.","topic":"USAF and USSF Core Values"},{"q":"Discuss the importance of the USAF and USSF Core Values to Airmen and Guardians.","a":"Bedrock of leadership in the Air and Space Forces. Institutional values and principles of conduct. Moral framework for military activities\nFundamental and enduring. For Airmen and Guardians, the Core Values help establish the character and professional standards expected of members of the Profession of Arms. Being an Airman or Guardian involves more than simply holding a military position. The lesson describes it as a combination of: \n\nProfession of Arms + Oaths we swear + Core Values/4 Cs we live by.   For the Space Force specifically, the Guardian Spirit describes the positive attributes expected of members and identifies Guardians as principled public servants, space-minded warfighters, and bold and collaborative problem solvers.","topic":"USAF and USSF Core Values"},{"q":"Recall the branch of government that establishes military authority.","a":"Military authority is derived from the executive branch.","topic":"US Constitution"},{"q":"List the three US Constitution governing principles.","a":"Federalism\nEnumerated Powers\nSeparation of Powers/Checks and Balances","topic":"US Constitution"},{"q":"Recall the Amendments to the US Constitution that govern military officer authority","a":"The Bill of Rights — the first ten amendments — places constitutional limits on military authority. \nThe Second Amendment prohibits military officers from taking weapons from the public.\nThe Third Amendment prohibits the military from forcing the public to house them.\nThe Fourth Amendment prohibits the military from searching the public or other military members without a warrant or probable cause. Military Commanders do control military installations and are allowed to search most areas under their control.\nThe Sixth, Seventh, and Eighth Amendment prohibits the military officer from punishing members for crimes without a trial.\nArticle 15s are the exception, but even still, the accused has the right to refuse the Article 15 and demand a Court Martial.\nThe Nineth Amendment states that just because a right was not mentioned in these Amendments, it doesn’t mean that the government can use this as an excuse to deny these other rights.","topic":"US Constitution"},{"q":"Summarize the definition of critical thinking.","a":"The process of thinking carefully about a subject or idea, without allowing feelings or opinions to affect you.","topic":"Critical Thinking"},{"q":"Discuss methods for evaluating information.","a":"The first step to evaluating information we receive is to decide whether it is a statement (also called a claim, assertion, or conclusion) or an argument for a given conclusion. Sometimes it can be hard to distinguish between statements and arguments. Statements versus arguments, fact versus opinion, objective versus subjective.","topic":"Critical Thinking"},{"q":"Identify the nine intellectual standards used in assessing one’s thinking.","a":"Clarity, accuracy, precision, relevance, depth, breadth, logic, significance, and fairness.","topic":"Critical Thinking"},{"q":"Explain clarity.","a":"A gateway standard and relevant to all others\n“Could you elaborate further?”","topic":"Critical Thinking"},{"q":"Explain accuracy.","a":"Addresses the validity of the information at hand\n“How can we find out if that’s true?”","topic":"Critical Thinking"},{"q":"Explain precision","a":"Helps refine information\n“Could you give more details?”","topic":"Critical Thinking"},{"q":"Explain relevance.","a":"Evaluates what’s most related to the issue\n“How does this relate to our issue?”","topic":"Critical Thinking"},{"q":"Explain depth.","a":"Addresses the complexities of an issue\n“What are the root causes of this issue, and does this address them?”","topic":"Critical Thinking"},{"q":"Explain breadth","a":"Addresses various interpretations of an issue\n“Do we need to consider another point of view here","topic":"Critical Thinking"},{"q":"Explain logic","a":"Thoughts are mutually supporting and makes sense\n“Does this really make sense?”","topic":"Critical Thinking"},{"q":"Explain significance.","a":"The most important pieces of an argument or issue\n“Which idea or concept is most important?”","topic":"Critical Thinking"},{"q":"Explain fairness.","a":"A “gut check” to avoid personal interests, ego, and unjustified assumptions\n“What justifies my thinking?”","topic":"Critical Thinking"},{"q":"Explain cognitive domain operations and their relationship to disinformation.","a":"Take people’s will, belief, thinking, and psychology as direct combat targets, and seek to affect decision-making and actions by changing the opponent’s cognition. It seeks to blend information, psychological warfare, cyberwarfare, and employ its propaganda across the information domain (i.e. social media).","topic":"Critical Thinking"},{"q":"Identify the elements of reasoning that are used in the critical thinking process.","a":"Purpose, questions, information, concept, inference, assumption, point of view, and implications.","topic":"Critical Thinking"},{"q":"Describe the elements of reasoning that are used in the critical thinking process.","a":"Purpose - What is the objective of my thinking?\nQuestion - Is this the right question?\nInformation - Is it accurate, fair, clear? Are there alternate sources? Do we need more?\nConcepts - What concepts (theories, axioms, principles) am I relying on? Do others accept them as well?\nInferences - What am I inferring here that is unstated? Is it valid?\nAssumptions - What beliefs and values influence my thinking? Are they balanced and fair?\nPoint of View - What is my viewpoint? Would it look different from another perspective?\nImplications - What might be the outcome? On what? For whom?","topic":"Critical Thinking"},{"q":"Discuss common thinking errors that can lead to faulty thinking","a":"System 1 - Fast, instinctive, emotional, unconscious; utilizes pattern recognition\nSystem 2 - Slow, deliberate, logical, conscious; discerns new patterns\nAsking the wrong questions (or not asking in the right way) \nThinking too quickly\nStereotypes\nCognitive bias (halo effect and belief perseverance)\nAnswering the wrong question - deflection","topic":"Critical Thinking"},{"q":"Define problem solving.","a":"Purposeful act of observing a problem and then deciding to solve it, after considering solutions and deciding upon one.","topic":"Problem Solving"},{"q":"Compare the 8-step practical problem-solving method to the OODA loop model.","a":"Both models are systematic approaches to solving problems, but they are designed for somewhat different situations. \n8 Steps Process - 1. Clarify and validate the problem. 2. Break down the problem and identify performance gaps. 3. Set improvement targets. 4. Determine root cause. 5. Develop countermeasures. 6. see countermeasures through. 7 confirm results and processes 8. standardize successful processes. \nOODA Loop - 1. Observe. 2. Orient. 3. Decide. 4. Act.","topic":"Problem Solving"},{"q":"Understand the steps for the 8-step practical problem solving method.","a":"1. Clarify and Validate the Problem – Clearly define the problem using objective, specific, and measurable terms. \n2. Break Down the Problem and Identify Performance Gaps – Gather and analyze data to understand the problem and determine the difference between current and desired performance. \n3. Set Improvement Targets – Establish strategic and tactical targets for the desired future state. \n4. Determine Root Cause – Identify the underlying cause rather than simply treating symptoms. \n5. Develop Countermeasures – Analyze possible solutions and select appropriate countermeasures based on effectiveness, feasibility, and impact. \n6. See Countermeasures Through – Implement the solution, monitor progress, use contingency plans, and provide necessary training. \n7. Confirm Results and Process – Use KPIs and metrics to determine whether the solution achieved the intended results. \n8. Standardize Successful Processes – Document successful solutions so the problem is less likely to return and share successful practices.","topic":"Problem Solving"},{"q":"Map the two problem solving models together.","a":"Steps 1–2 = Observe; Steps 3–4 = Orient; Step 5 = Decide; and Steps 6–8 = Act.","topic":"Problem Solving"},{"q":"Remember the four stages of growth.","a":"1. Forming. 2. Storming. 3. Norming. 4. Performing.","topic":"Team Building"},{"q":"Describe leader and follower actions that contribute to effective teams.","a":"(Forming) \"Director\" - the team leader should be directive, helping team focus on getting to know one another, identifying members' roles, and clearly understanding the team's mission/tasks\n(Storming) \"Coach\" - team leader who can control the chaos by creating a climate of open discussion, listening to members' concerns, obtaining members' input on how to achieve goals, being encouraging and supportive, and facilitating conflict resolution \n(Norming) \"Collaborator\" - team leader as a facilitator, focusing on maximizing members' contributions by delegating responsibilities, building members' confidence, and maximizing members' strengths. \n(Performing) \"Visionary\" - team leader efforts should be on maintaining success and shifting team's perspectives from inward to outward focus by planning for the future, cultivating leadership talent with team, and fostering new ideas from team members, and ensuring solid mechanisms for feedback.","topic":"Team Building"},{"q":"Differentiate the characteristics of laissez-faire, transactional, and transformational leadership:","a":"Laissez-faire - Laissez-faire is hands-off leadership and is essentially the absence of leadership. It is an avoidant, non-leadership approach rather than an effective leadership style. \nTransactional - Transactional leadership maintains organizational stability through exchanges between leaders and followers to achieve goals. The leader establishes expectations and uses rewards and/or corrective actions to influence performance. Two examples: Contingent Reward (CR) and Management by Exception (MBE). \n\nTransformational leadership - Transformational leadership creates personal relationships with followers that raise their level of motivation and morality. Transformational leadership consists of four behaviors/components: Idealized Influence (II), Inspirational Motivation (IM) Intellectual Stimulation (IS), and Individualized Consideration (IC)","topic":"Full Range Leadership"},{"q":"Describe how to apply FRL.","a":"NOT a continuum from “bad” to “good”\nDifferent circumstances require different approaches\nMay utilize several approaches at the same time  \nBlending and emphasizing approaches is critical","topic":"Full Range Leadership"},{"q":"Summarize the five basic styles of followership.","a":"Sheep - passive participants and uncritical thinkers; simply comply with any order given; lack initiative; purely reactive; do what they are told, and nothing more. \nYes people - active participants and uncritical thinkers; dependent on leadership direction; \nSurvivors - display qualities of each other type of follower; rarely committed to workplace or group goals; do enough just to get by; seek to minimize interpersonal and intellectual risks\nAlienated followers - passive participants and critical thinkers; independent,  capable  of high performance; focus and actions based upon negative experiences; criticize, but rarely offer constructive input\nEffective followers - active participants and critical thinkers; independent, intent on high performance; proactive and think ahead; work well with others; reflect on goals of the organization; not hesitant to bring concerns to leaders","topic":"Followership"},{"q":"Distinguish between the characteristics of an effective follower","a":"Support, don’t undermine\nDisagree privately\nDisplay initiative\nAccept responsibility\nTell the truth\nAnticipate boss’s questions\nKnow their limitations and strengths\nKeep boss informed\nSelfless in service\nDon’t forget their families","topic":"Followership"},{"q":"Distinguish between distributive and integrative approaches to negotiations.","a":"Distributive Negotiation: assumes responsibilities are limited, zero sum-gain perspective leads to competition rather than cooperation; defaults to taking a position (what you want)\nIntegrative Negotiations: Does not see resources as fixed or zero sum-gain; seeks to achieve solutions and protect relationships; ask about interests (why you want what you want), concerns, limitations.","topic":"Conflict Management"},{"q":"Describe sources of conflict.","a":"Organizational (communications, and structural: rewards and resource independence) \nPersonal behaviors (values, perception, and personality)","topic":"Conflict Management"},{"q":"Infer which problem solving-approach to use to best manage conflict in a given scenario.","a":"Cooperative (high task, high people); Insist (high task, low people); evade (low task, low people); comply (low task, high people); settle (splitting the difference); \n\n*cooperative/interest-based negotiation (use when both the task and the relationship are important). \n*Consider how TIPO (trust, information, power, options) looks in each.","topic":"Conflict Management"},{"q":"Identify the problem solving approach evade.","a":"\"Not now, can you come back later?\"","topic":"Conflict Management"},{"q":"Identify the problem solving approach comply.","a":"\"Yes, absolutely, let's do it your way!\"","topic":"Conflict Management"},{"q":"Identify the problem solving approach insist.","a":"\"Take it or leave it\" or \"Today - Do it my way!\"","topic":"Conflict Management."},{"q":"Identify the problem solving approach settle.","a":"\"Let's split the difference and call it a day.\"","topic":"Conflict Management"},{"q":"Identify the problem-solving approach cooperative (Interest-based negotiation)","a":"\"Let's work together and come up with an even better solution.\"","topic":"Conflict Management"},{"q":"**Recognize the difference between mission and vision statements. (Know what good and bad ones look like)","a":"Mission (purpose/goal; must have ACTIONs so we know how to accomplish the \"what\" and the \"who\") \nVision (describes the future state of an organization); aspiration/feeling; answers the \"why\" and \"how\" - stand alone and straightforward","topic":"Inspiring Action"},{"q":"**Recognize a good vision statement (key elements)","a":"Idealistic yet achievable\nArticulated well and easily understood\nProvides clarity of purpose and direction\nShared and supported","topic":"Inspiring Action"},{"q":"Recall the purpose of using the Strengths, Weaknesses, Opportunities, Threats (SWOT) method to identify priorities.","a":"Assess how to use strengths to advantage\nAssess how to minimize/overcome weaknesses \nHow positive work forces together and potential problems that need to be recognized and addressed","topic":"Inspiring Action"},{"q":"Describe techniques for encouraging continued action toward a vision.","a":"Get their attention\nArticulate the vision\nFrame meaning\nEnable action\nReinforce action","topic":"Inspiring Action"},{"q":"Recognize Lewin's Change Management model (1940)","a":"Unfreezing \nChanging\nRefreezing\n*each stage has opportunities and difficulties (driving and restraining forces)","topic":"Change Management"},{"q":"Identify common resistance to change.","a":"Distrust\n****Uncertainty\nSelf-Interest\nDifferent Perception/No Felt Need to Change\nOver-Determination","topic":"Change Management"},{"q":"List the method leaders use to reduce and manage resistance to change.","a":"Remove Obstacles (empowerment); Use the coalition to assist with necessary policy changes to support the change; Instill Knowledge; Develop Ability\nCreate Short-Term Wins; “Quick-wins” to reach milestones & reduce criticism; Recognize strong performers","topic":"Change Management"},{"q":"What are the stages of Lewin's model?","a":"Unfreeze, Change, and Refreeze","topic":"Change Management"},{"q":"What are some common forms of resistance?","a":"Distrust, uncertainty, negative self-interest, different perceptions, and over-determination","topic":"Change Management"},{"q":"List some of the responsibilities of a leader in a change effort.","a":"Follow the plan, communicate, provide support, remove barriers to change, set short-term and long-term goals, analyze and evaluate changes.","topic":"Change Management"}];
const key='ots-hub-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}let data={cards:Array.isArray(saved.cards)?saved.cards:starter,hard:saved.hard||[],mastered:saved.mastered||[],scores:saved.scores||[],name:saved.name||'',points:saved.points||0};let editing=-1,order=[],idx=0,flipped=false,quizOrder=[],qi=0,qscore=0,answered=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(data))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function tab(t){['home','study','quiz','manage','leaderboard'].forEach(x=>$(x).classList.toggle('hide',x!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home:renderHome,study:renderStudy,quiz:renderQuiz,manage:renderManage,leaderboard:renderBoard})[t]()}const names={home:'Dashboard',study:'Flashcards',quiz:'Quiz',manage:'Add material',leaderboard:'Leaderboard'};$('tabs').innerHTML=Object.entries(names).map(([k,v])=>`<button data-tab="${k}" onclick="tab('${k}')">${v}</button>`).join('');function renderHome(){$('home').innerHTML=`<h2>Flight dashboard</h2><p class="muted">Your progress is saved in this browser on this device.</p><div class="flex"><span class="pill">${data.cards.length} cards</span><span class="pill">${data.mastered.length} mastered</span><span class="pill">${data.hard.length} difficult</span><span class="pill">${data.points} points</span></div><p><label>Your display name</label><input id="name" maxlength="40" value="${esc(data.name)}" placeholder="Enter your name"></p><button onclick="data.name=$('name').value.trim();save();renderHome()">Save name</button> <button onclick="tab('study')">Start studying</button><div class="notice"><strong>Prototype:</strong> Leaderboard scores are stored only on this device. Do not upload classified, CUI, or other restricted training materials to an unapproved app.</div>`}function ensureOrder(){order=order.filter(i=>i<data.cards.length);if(!order.length&&data.cards.length){order=data.cards.map((_,i)=>i);idx=0}}function renderStudy(){ensureOrder();if(!data.cards.length){$('study').innerHTML='<h2>No cards yet</h2><button onclick="tab(\'manage\')">Add cards</button>';return}idx=Math.min(idx,order.length-1);let i=order[idx],c=data.cards[i];$('study').innerHTML=`<div class="flex space"><h2>Flashcards</h2><span class="pill">${idx+1} / ${order.length}</span></div><p class="muted">${esc(c.topic||'General')} · Tap card to flip</p><div class="card ${flipped?'answer':''}" role="button" tabindex="0" onclick="flipped=!flipped;renderStudy()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipped=!flipped;renderStudy()}">${esc(flipped?c.a:c.q)}</div><div class="flex"><button onclick="idx=(idx-1+order.length)%order.length;flipped=false;renderStudy()">← Previous</button><button onclick="flipped=!flipped;renderStudy()">Flip</button><button onclick="idx=(idx+1)%order.length;flipped=false;renderStudy()">Next →</button></div><hr><div class="flex"><button class="secondary" onclick="editCard(${i})">✎ Edit card</button><button class="danger" onclick="deleteCard(${i})">Delete card</button><button class="secondary" onclick="toggleHard(${i})">${data.hard.includes(i)?'★ Difficult':'☆ Mark difficult'}</button><button class="secondary" onclick="toggleMaster(${i})">${data.mastered.includes(i)?'✓ Mastered':'Mark mastered'}</button><button class="secondary" onclick="order=shuffle(order);idx=0;flipped=false;renderStudy()">Shuffle</button><button class="secondary" onclick="order=data.hard.filter(i=>i<data.cards.length);idx=0;flipped=false;renderStudy()">Study difficult only</button><button class="secondary" onclick="order=data.cards.map((_,i)=>i);idx=0;flipped=false;renderStudy()">All cards</button></div>`}function toggleHard(i){data.hard=data.hard.includes(i)?data.hard.filter(x=>x!==i):[...data.hard,i];save();renderStudy()}function toggleMaster(i){data.mastered=data.mastered.includes(i)?data.mastered.filter(x=>x!==i):[...data.mastered,i];save();renderStudy()}function startQuiz(){quizOrder=shuffle(data.cards.map((c,i)=>i).filter(i=>data.cards[i].choices?.length===4&&Number.isInteger(data.cards[i].correct)));qi=0;qscore=0;answered=false;renderQuiz()}function renderQuiz(){if(!quizOrder.length){$('quiz').innerHTML='<h2>Multiple-choice quiz</h2><p>Questions with four answer choices are eligible for quizzes.</p><button onclick="startQuiz()">Start shuffled quiz</button>';return}if(qi>=quizOrder.length){let pct=Math.round(100*qscore/quizOrder.length);data.scores.push({name:data.name||'Anonymous',score:qscore,total:quizOrder.length,pct,date:new Date().toISOString()});data.points+=qscore*10;save();quizOrder=[];$('quiz').innerHTML=`<h2>Quiz complete</h2><p>You scored <strong>${qscore} / ${data.scores.at(-1).total} (${pct}%)</strong>.</p><button onclick="startQuiz()">Try again</button> <button onclick="tab('leaderboard')">View leaderboard</button>`;return}let c=data.cards[quizOrder[qi]];$('quiz').innerHTML=`<h2>Quiz · ${qi+1} / ${quizOrder.length}</h2><p><strong>${esc(c.q)}</strong></p><div id="answers">${c.choices.map((v,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button id="next" class="hide" onclick="qi++;answered=false;renderQuiz()">${qi+1===quizOrder.length?'Finish quiz':'Next question →'}</button>`}function choose(i){if(answered)return;answered=true;let c=data.cards[quizOrder[qi]];if(i===c.correct)qscore++;document.querySelectorAll('#answers button').forEach((b,j)=>{b.disabled=true;if(j===c.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(i===c.correct?'Correct! ':'Not quite. ')+c.a;$('next').classList.remove('hide')}
function renderManage(){$('manage').innerHTML=`<h2>${editing>=0?'Edit flashcard':'Add course material'}</h2><p class="muted">Add individual cards or paste tab-separated question/answer pairs (one pair per line). Quiz choices can be added with the form.</p><label>Lesson / topic</label><input id="topic" placeholder="e.g., Leadership"><label>Question</label><textarea id="question" placeholder="Enter question"></textarea><label>Answer / explanation</label><textarea id="answer" placeholder="Enter answer"></textarea><label>Four multiple-choice options (optional)</label>${[0,1,2,3].map(i=>`<input id="opt${i}" placeholder="Option ${i+1}">`).join('')}<label>Correct option</label><select id="correct"><option value="0">Option 1</option><option value="1">Option 2</option><option value="2">Option 3</option><option value="3">Option 4</option></select><div class="flex"><button onclick="addCard()">${editing>=0?'Save changes':'Add flashcard'}</button>${editing>=0?'<button class="secondary" onclick="editing=-1;renderManage()">Cancel editing</button>':''}</div><hr><h3>Existing cards</h3><p class="muted">Select Edit to correct a card or Delete to remove one. Export a backup first if needed. Deletion cannot be undone.</p><div id="cardlist">${data.cards.map((c,i)=>`<div class="notice"><strong>${esc(c.topic||'General')}</strong>: ${esc(c.q)} <button class="secondary" onclick="editCard(${i})">Edit</button> <button class="danger" onclick="deleteCard(${i})">Delete</button></div>`).join('')||'<p>No cards yet.</p>'}</div><hr><h3>Paste multiple cards</h3><p class="muted">Format: question [TAB] answer. Each pair on its own line. These become flashcards; add quiz options individually above.</p><textarea id="bulk" placeholder="What is ...?&#9;Definition ..."></textarea><button onclick="bulkAdd()">Import pasted cards</button><p id="status" aria-live="polite"></p><hr><h3>Backup and share a card deck</h3><p class="muted">Export JSON to share a deck file with classmates. Import replaces your current deck; back it up first. Scores are not included.</p><div class="flex"><button class="secondary" onclick="exportDeck()">Export deck JSON</button><label style="font-weight:normal">Import deck JSON <input type="file" accept=".json,application/json" onchange="importDeck(event)"></label></div><p><small>PowerPoint, PDF and Word files are not parsed in this prototype. Extract or paste approved text and convert it into question/answer pairs. Do not use unapproved systems for sensitive course material.</small></p>`}function deleteCard(i){if(!Number.isInteger(i)||i<0||i>=data.cards.length)return;let c=data.cards[i];if(!confirm(`Delete this card permanently?\n\n${c.q}\n\nThis cannot be undone. Export a JSON backup first if you want to keep a copy.`))return;data.cards.splice(i,1);data.hard=data.hard.filter(n=>n!==i).map(n=>n>i?n-1:n);data.mastered=data.mastered.filter(n=>n!==i).map(n=>n>i?n-1:n);editing=-1;order=[];idx=0;flipped=false;quizOrder=[];qi=0;answered=false;save();let visible=['home','study','quiz','manage','leaderboard'].find(t=>!$(t).classList.contains('hide'))||'manage';tab(visible);if(visible==='manage')$('status').textContent='Card deleted. Export your updated JSON deck to keep a backup.';}function editCard(i){if(!data.cards[i])return;editing=i;tab('manage');let c=data.cards[i];$('topic').value=c.topic||'';$('question').value=c.q;$('answer').value=c.a;for(let j=0;j<4;j++)$('opt'+j).value=c.choices?.[j]||'';$('correct').value=String(c.correct??0);$('question').focus();window.scrollTo(0,0)}function addCard(){let q=$('question').value.trim(),a=$('answer').value.trim(),topic=$('topic').value.trim()||'General',choices=[0,1,2,3].map(i=>$('opt'+i).value.trim());if(!q||!a){$('status').textContent='Enter both a question and answer.';return}if(choices.some(Boolean)&&!choices.every(Boolean)){$('status').textContent='Provide all four choices or leave all blank.';return}let card={q,a,topic,...(choices.every(Boolean)?{choices,correct:Number($('correct').value)}:{})};let wasEditing=editing>=0;if(wasEditing){data.cards[editing]=card}else{data.cards.push(card)}editing=-1;save();order=[];quizOrder=[];renderManage();$('status').textContent=wasEditing?'Card updated successfully.':'Card added successfully.'}function bulkAdd(){let lines=$('bulk').value.split(/\r?\n/).filter(x=>x.trim()),added=0;for(let line of lines){let parts=line.split('\t');if(parts.length>=2&&parts[0].trim()&&parts.slice(1).join('\t').trim()){data.cards.push({q:parts[0].trim(),a:parts.slice(1).join('\t').trim(),topic:$('topic').value.trim()||'General'});added++}}save();order=[];$('status').textContent=`Imported ${added} of ${lines.length} lines.`;if(added)$('bulk').value=''}function exportDeck(){let blob=new Blob([JSON.stringify({version:1,cards:data.cards},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ots-flight-deck.json';a.click();URL.revokeObjectURL(url)}async function importDeck(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.cards)||!obj.cards.every(c=>typeof c.q==='string'&&typeof c.a==='string'&&(!c.choices||(Array.isArray(c.choices)&&c.choices.length===4&&c.choices.every(v=>typeof v==='string')&&Number.isInteger(c.correct)&&c.correct>=0&&c.correct<4))))throw Error('Invalid deck format');if(!confirm(`Replace your current ${data.cards.length} cards with ${obj.cards.length} imported cards? Export your deck first if needed.`))return;data.cards=obj.cards.map(c=>({q:c.q,a:c.a,topic:typeof c.topic==='string'?c.topic:'General',...(c.choices?{choices:c.choices,correct:c.correct}:{})}));data.hard=[];data.mastered=[];editing=-1;order=[];quizOrder=[];save();renderManage();$('status').textContent=`Imported ${data.cards.length} cards.`}catch(err){$('status').textContent='Could not import: '+err.message}}function renderBoard(){let rows=[...data.scores].sort((a,b)=>b.pct-a.pct||b.score-a.score).slice(0,20);$('leaderboard').innerHTML=`<h2>Leaderboard preview</h2><p class="muted">Only quiz attempts saved in this browser appear here. This is not yet a shared flight leaderboard. Percentages are shown alongside question counts because quiz lengths can differ.</p>${rows.length?`<table><thead><tr><th>Rank</th><th>Name</th><th>Score</th><th>Accuracy</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}/${r.total}</td><td>${r.pct}%</td></tr>`).join('')}</tbody></table>`:'<p>No quiz scores yet. Complete a quiz to appear here.</p>'}`}tab('home');
</script></body></html>
