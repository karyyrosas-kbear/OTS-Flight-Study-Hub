<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTS Flight Study Hub</title><style>:root{font-family:system-ui,Arial;background:#eef2f7;color:#17243b}*{box-sizing:border-box}body{margin:0}header{background:#102747;color:white;padding:22px max(20px,calc((100vw - 900px)/2))}h1{margin:0;font-size:1.6rem}header p{margin:5px 0;color:#c9d9eb}main{max-width:900px;margin:auto;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#173d69;color:white;font-weight:650}button.secondary{background:#dce5ef;color:#18314c}button:disabled{opacity:.5;cursor:default}.tabs button.active{background:#087d89}.panel{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #132b4414;margin-bottom:18px}.muted{color:#52647b}.flex{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.card{min-height:230px;border:2px solid #bed2e5;border-radius:15px;display:grid;place-items:center;text-align:center;padding:25px;margin:20px 0;background:#f5f9fd;cursor:pointer;font-size:1.35rem;font-weight:650;white-space:pre-wrap}.answer{background:#eaf8f1;border-color:#7ac6a4}input,textarea,select{width:100%;padding:11px;border:1px solid #b8c7d5;border-radius:8px;font:inherit;margin:5px 0 13px}textarea{min-height:95px}label{font-weight:650} .option{display:block;width:100%;margin:7px 0;text-align:left;background:#e7edf4;color:#17243b}.correct{background:#b5e7c8!important}.wrong{background:#ffd2d2!important}.pill{display:inline-block;background:#dceaf8;border-radius:50px;padding:5px 10px;margin:4px;font-size:.85rem} .hide{display:none} .notice{padding:10px;border-radius:8px;background:#edf7f7;margin:10px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}small{color:#586d82} .danger{background:#9b3030} @media(max-width:600px){main{padding:12px}.panel{padding:15px}.card{font-size:1.1rem}}</style></head><body><header><h1>✦ OTS Flight Study Hub</h1><p>Study smarter. Build confidence. Learn together.</p></header><main><div class="tabs" id="tabs"></div><section id="home" class="panel"></section><section id="study" class="panel hide"></section><section id="quiz" class="panel hide"></section><section id="manage" class="panel hide"></section><section id="leaderboard" class="panel hide"></section></main><script>
const starter=[{q:'What is transactional leadership?',a:'A leadership approach emphasizing clear expectations, performance, rewards, and corrective action.',choices:['Leadership based on exchanges, expectations, and rewards','Leadership with no performance standards','Leadership that avoids corrective action','Leadership based only on personal charisma'],correct:0,topic:'Leadership'},{q:'What is active management by exception (MBE-A)?',a:'A leader actively monitors performance for deviations and takes corrective action when needed.',choices:['Ignoring deviations','Actively monitoring for deviations and correcting them','Only rewarding exceptional work','Delegating all oversight'],correct:1,topic:'Leadership'},{q:'Why is audience awareness important in an intelligence briefing?',a:'It helps tailor the level of detail, terminology, and key judgments to decision-makers’ needs.',choices:['It eliminates the need for evidence','It ensures every briefing is identical','It helps tailor the message to decision-makers','It replaces critical thinking'],correct:2,topic:'Communication'},{q:'What should an intelligence assessment clearly explain?',a:'Its key judgment, supporting evidence, reasoning, uncertainty, and why the assessment matters.',choices:['Only the analyst’s conclusion','Only background information','Only the most recent report','The judgment, evidence, reasoning, uncertainty, and significance'],correct:3,topic:'Critical Thinking'}];
const key='ots-hub-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{}let data={cards:Array.isArray(saved.cards)?saved.cards:starter,hard:saved.hard||[],mastered:saved.mastered||[],scores:saved.scores||[],name:saved.name||'',points:saved.points||0};let editing=-1,order=[],idx=0,flipped=false,quizOrder=[],qi=0,qscore=0,answered=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(data))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function tab(t){['home','study','quiz','manage','leaderboard'].forEach(x=>$(x).classList.toggle('hide',x!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home:renderHome,study:renderStudy,quiz:renderQuiz,manage:renderManage,leaderboard:renderBoard})[t]()}const names={home:'Dashboard',study:'Flashcards',quiz:'Quiz',manage:'Add material',leaderboard:'Leaderboard'};$('tabs').innerHTML=Object.entries(names).map(([k,v])=>`<button data-tab="${k}" onclick="tab('${k}')">${v}</button>`).join('');function renderHome(){$('home').innerHTML=`<h2>Flight dashboard</h2><p class="muted">Your progress is saved in this browser on this device.</p><div class="flex"><span class="pill">${data.cards.length} cards</span><span class="pill">${data.mastered.length} mastered</span><span class="pill">${data.hard.length} difficult</span><span class="pill">${data.points} points</span></div><p><label>Your display name</label><input id="name" maxlength="40" value="${esc(data.name)}" placeholder="Enter your name"></p><button onclick="data.name=$('name').value.trim();save();renderHome()">Save name</button> <button onclick="tab('study')">Start studying</button><div class="notice"><strong>Prototype:</strong> Leaderboard scores are stored only on this device. Do not upload classified, CUI, or other restricted training materials to an unapproved app.</div>`}function ensureOrder(){order=order.filter(i=>i<data.cards.length);if(!order.length&&data.cards.length){order=data.cards.map((_,i)=>i);idx=0}}function renderStudy(){ensureOrder();if(!data.cards.length){$('study').innerHTML='<h2>No cards yet</h2><button onclick="tab(\'manage\')">Add cards</button>';return}idx=Math.min(idx,order.length-1);let i=order[idx],c=data.cards[i];$('study').innerHTML=`<div class="flex space"><h2>Flashcards</h2><span class="pill">${idx+1} / ${order.length}</span></div><p class="muted">${esc(c.topic||'General')} · Tap card to flip</p><div class="card ${flipped?'answer':''}" role="button" tabindex="0" onclick="flipped=!flipped;renderStudy()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipped=!flipped;renderStudy()}">${esc(flipped?c.a:c.q)}</div><div class="flex"><button onclick="idx=(idx-1+order.length)%order.length;flipped=false;renderStudy()">← Previous</button><button onclick="flipped=!flipped;renderStudy()">Flip</button><button onclick="idx=(idx+1)%order.length;flipped=false;renderStudy()">Next →</button></div><hr><div class="flex"><button class="secondary" onclick="editCard(${i})">✎ Edit card</button><button class="secondary" onclick="toggleHard(${i})">${data.hard.includes(i)?'★ Difficult':'☆ Mark difficult'}</button><button class="secondary" onclick="toggleMaster(${i})">${data.mastered.includes(i)?'✓ Mastered':'Mark mastered'}</button><button class="secondary" onclick="order=shuffle(order);idx=0;flipped=false;renderStudy()">Shuffle</button><button class="secondary" onclick="order=data.hard.filter(i=>i<data.cards.length);idx=0;flipped=false;renderStudy()">Study difficult only</button><button class="secondary" onclick="order=data.cards.map((_,i)=>i);idx=0;flipped=false;renderStudy()">All cards</button></div>`}function toggleHard(i){data.hard=data.hard.includes(i)?data.hard.filter(x=>x!==i):[...data.hard,i];save();renderStudy()}function toggleMaster(i){data.mastered=data.mastered.includes(i)?data.mastered.filter(x=>x!==i):[...data.mastered,i];save();renderStudy()}function startQuiz(){quizOrder=shuffle(data.cards.map((c,i)=>i).filter(i=>data.cards[i].choices?.length===4&&Number.isInteger(data.cards[i].correct)));qi=0;qscore=0;answered=false;renderQuiz()}function renderQuiz(){if(!quizOrder.length){$('quiz').innerHTML='<h2>Multiple-choice quiz</h2><p>Questions with four answer choices are eligible for quizzes.</p><button onclick="startQuiz()">Start shuffled quiz</button>';return}if(qi>=quizOrder.length){let pct=Math.round(100*qscore/quizOrder.length);data.scores.push({name:data.name||'Anonymous',score:qscore,total:quizOrder.length,pct,date:new Date().toISOString()});data.points+=qscore*10;save();quizOrder=[];$('quiz').innerHTML=`<h2>Quiz complete</h2><p>You scored <strong>${qscore} / ${data.scores.at(-1).total} (${pct}%)</strong>.</p><button onclick="startQuiz()">Try again</button> <button onclick="tab('leaderboard')">View leaderboard</button>`;return}let c=data.cards[quizOrder[qi]];$('quiz').innerHTML=`<h2>Quiz · ${qi+1} / ${quizOrder.length}</h2><p><strong>${esc(c.q)}</strong></p><div id="answers">${c.choices.map((v,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button id="next" class="hide" onclick="qi++;answered=false;renderQuiz()">${qi+1===quizOrder.length?'Finish quiz':'Next question →'}</button>`}function choose(i){if(answered)return;answered=true;let c=data.cards[quizOrder[qi]];if(i===c.correct)qscore++;document.querySelectorAll('#answers button').forEach((b,j)=>{b.disabled=true;if(j===c.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(i===c.correct?'Correct! ':'Not quite. ')+c.a;$('next').classList.remove('hide')}
function renderManage(){$('manage').innerHTML=`<h2>${editing>=0?'Edit flashcard':'Add course material'}</h2><p class="muted">Add individual cards or paste tab-separated question/answer pairs (one pair per line). Quiz choices can be added with the form.</p><label>Lesson / topic</label><input id="topic" placeholder="e.g., Leadership"><label>Question</label><textarea id="question" placeholder="Enter question"></textarea><label>Answer / explanation</label><textarea id="answer" placeholder="Enter answer"></textarea><label>Four multiple-choice options (optional)</label>${[0,1,2,3].map(i=>`<input id="opt${i}" placeholder="Option ${i+1}">`).join('')}<label>Correct option</label><select id="correct"><option value="0">Option 1</option><option value="1">Option 2</option><option value="2">Option 3</option><option value="3">Option 4</option></select><div class="flex"><button onclick="addCard()">${editing>=0?'Save changes':'Add flashcard'}</button>${editing>=0?'<button class="secondary" onclick="editing=-1;renderManage()">Cancel editing</button>':''}</div><hr><h3>Existing cards</h3><p class="muted">Select Edit to correct a question, answer, topic, or quiz options.</p><div id="cardlist">${data.cards.map((c,i)=>`<div class="notice"><strong>${esc(c.topic||'General')}</strong>: ${esc(c.q)} <button class="secondary" onclick="editCard(${i})">Edit</button></div>`).join('')||'<p>No cards yet.</p>'}</div><hr><h3>Paste multiple cards</h3><p class="muted">Format: question [TAB] answer. Each pair on its own line. These become flashcards; add quiz options individually above.</p><textarea id="bulk" placeholder="What is ...?&#9;Definition ..."></textarea><button onclick="bulkAdd()">Import pasted cards</button><p id="status" aria-live="polite"></p><hr><h3>Backup and share a card deck</h3><p class="muted">Export JSON to share a deck file with classmates. Import replaces your current deck; back it up first. Scores are not included.</p><div class="flex"><button class="secondary" onclick="exportDeck()">Export deck JSON</button><label style="font-weight:normal">Import deck JSON <input type="file" accept=".json,application/json" onchange="importDeck(event)"></label></div><p><small>PowerPoint, PDF and Word files are not parsed in this prototype. Extract or paste approved text and convert it into question/answer pairs. Do not use unapproved systems for sensitive course material.</small></p>`}function editCard(i){if(!data.cards[i])return;editing=i;tab('manage');let c=data.cards[i];$('topic').value=c.topic||'';$('question').value=c.q;$('answer').value=c.a;for(let j=0;j<4;j++)$('opt'+j).value=c.choices?.[j]||'';$('correct').value=String(c.correct??0);$('question').focus();window.scrollTo(0,0)}function addCard(){let q=$('question').value.trim(),a=$('answer').value.trim(),topic=$('topic').value.trim()||'General',choices=[0,1,2,3].map(i=>$('opt'+i).value.trim());if(!q||!a){$('status').textContent='Enter both a question and answer.';return}if(choices.some(Boolean)&&!choices.every(Boolean)){$('status').textContent='Provide all four choices or leave all blank.';return}let card={q,a,topic,...(choices.every(Boolean)?{choices,correct:Number($('correct').value)}:{})};let wasEditing=editing>=0;if(wasEditing){data.cards[editing]=card}else{data.cards.push(card)}editing=-1;save();order=[];quizOrder=[];renderManage();$('status').textContent=wasEditing?'Card updated successfully.':'Card added successfully.'}function bulkAdd(){let lines=$('bulk').value.split(/\r?\n/).filter(x=>x.trim()),added=0;for(let line of lines){let parts=line.split('\t');if(parts.length>=2&&parts[0].trim()&&parts.slice(1).join('\t').trim()){data.cards.push({q:parts[0].trim(),a:parts.slice(1).join('\t').trim(),topic:$('topic').value.trim()||'General'});added++}}save();order=[];$('status').textContent=`Imported ${added} of ${lines.length} lines.`;if(added)$('bulk').value=''}function exportDeck(){let blob=new Blob([JSON.stringify({version:1,cards:data.cards},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ots-flight-deck.json';a.click();URL.revokeObjectURL(url)}async function importDeck(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.cards)||!obj.cards.every(c=>typeof c.q==='string'&&typeof c.a==='string'&&(!c.choices||(Array.isArray(c.choices)&&c.choices.length===4&&c.choices.every(v=>typeof v==='string')&&Number.isInteger(c.correct)&&c.correct>=0&&c.correct<4))))throw Error('Invalid deck format');if(!confirm(`Replace your current ${data.cards.length} cards with ${obj.cards.length} imported cards? Export your deck first if needed.`))return;data.cards=obj.cards.map(c=>({q:c.q,a:c.a,topic:typeof c.topic==='string'?c.topic:'General',...(c.choices?{choices:c.choices,correct:c.correct}:{})}));data.hard=[];data.mastered=[];editing=-1;order=[];quizOrder=[];save();renderManage();$('status').textContent=`Imported ${data.cards.length} cards.`}catch(err){$('status').textContent='Could not import: '+err.message}}function renderBoard(){let rows=[...data.scores].sort((a,b)=>b.pct-a.pct||b.score-a.score).slice(0,20);$('leaderboard').innerHTML=`<h2>Leaderboard preview</h2><p class="muted">Only quiz attempts saved in this browser appear here. This is not yet a shared flight leaderboard. Percentages are shown alongside question counts because quiz lengths can differ.</p>${rows.length?`<table><thead><tr><th>Rank</th><th>Name</th><th>Score</th><th>Accuracy</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}/${r.total}</td><td>${r.pct}%</td></tr>`).join('')}</tbody></table>`:'<p>No quiz scores yet. Complete a quiz to appear here.</p>'}`}tab('home');
</script></body></html>
